<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JudicAI 3D | AI Courtroom</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b121c;--glass:rgba(14,22,34,.78);--line:rgba(217,170,74,.35);--text:#eef2f8;--muted:#9fb0c4;--brass:#d9aa4a;--an:#3fb5a4;--pr:#e5625f;--df:#5a8fe0;--jd:#b392f0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;font-size:14px;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#c:active{cursor:grabbing}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px)}
#top{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px 14px;z-index:5;white-space:nowrap}
#top b{font-family:"Playfair Display",Georgia,serif;font-size:18px;color:var(--brass);margin-right:6px}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--brass);color:#1a1205;border-color:var(--brass)}.chip.done{color:var(--text)}
#panel{position:fixed;left:12px;top:12px;bottom:12px;width:300px;padding:14px;overflow-y:auto;z-index:4}
#panel h2{margin:44px 0 8px;font-family:"Playfair Display",Georgia,serif;font-size:17px}
label{display:block;font-size:12px;font-weight:600;margin:9px 0 3px;color:var(--muted)}
input[type=text],select,textarea{width:100%;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px;font:inherit}
textarea{min-height:70px;resize:vertical}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer}
button:hover{border-color:var(--brass)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.go{background:var(--brass);color:#1a1205;border-color:var(--brass);width:100%;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cams{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.cams button{padding:4px 8px;font-size:12px}
.chk{display:flex;gap:7px;align-items:center;font-size:13px;margin:6px 0;font-weight:500;color:var(--text)}
#err{display:none;color:var(--pr);margin-top:8px;font-weight:600;font-size:13px}
.small{font-size:11px;color:var(--muted);margin-top:10px}
#ev{position:fixed;right:12px;top:12px;width:270px;max-height:60vh;overflow-y:auto;padding:10px;z-index:4;display:none}
#ev h3{margin:0 0 8px;font-family:"Playfair Display",Georgia,serif;font-size:15px}
.card{border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:7px 9px;margin-bottom:6px;font-size:12px;animation:in .4s both}
.card b{display:block}.card i{color:var(--muted);font-style:normal}
.tg{font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid;margin-right:4px;display:inline-block;margin-top:4px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#sub{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(820px,calc(100% - 40px));padding:12px 18px;z-index:4;display:none;text-align:center}
#sub .who{font-weight:700;font-size:13px;margin-bottom:3px}
#sub .t{font-size:18px;line-height:1.45}
#verdict{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 30px));padding:24px;z-index:6;display:none;text-align:center;border:2px solid var(--brass)}
#verdict.show{display:block;animation:stamp .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{from{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
#verdict h3{margin:0;color:var(--muted);font-size:12px;font-weight:600}
#vt{font-family:"Playfair Display",Georgia,serif;font-size:40px;color:var(--brass);margin:4px 0 8px}
#verdict ul{text-align:left;margin:8px 0 12px;padding-left:20px;color:var(--muted)}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;font-family:"Playfair Display",Georgia,serif;font-size:22px;color:var(--brass)}
body.rec #panel,body.rec #top,body.rec #ev,body.rec .recbtn{display:none!important}
.recbtn{position:fixed;right:12px;bottom:12px;z-index:5;padding:6px 10px;font-size:12px}
@media (max-width:820px){#panel{width:auto;right:12px;bottom:auto;max-height:44vh}#ev{display:none!important}#top{display:none}}
@media (prefers-reduced-motion: reduce){.card,#verdict.show{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">Convening the court…</div>
<div id="top" class="glass"><b>JudicAI</b><span class="chip" data-s="0">Court opens</span><span class="chip" data-s="1">Evidence</span><span class="chip" data-s="2">Debate</span><span class="chip" data-s="3">Verdict</span></div>

<aside id="panel" class="glass">
  <h2>Case file</h2>
  <label for="title">Case title</label><input id="title" type="text" maxlength="100">
  <label for="type">Case type</label><select id="type"><option value="criminal">Criminal</option><option value="civil">Civil</option></select>
  <label for="details">Case details</label><textarea id="details"></textarea>
  <label for="evid">Evidence (one per line)</label><textarea id="evid"></textarea>
  <button class="go" id="demo" type="button">▶ Play demo trial</button>
  <div class="grid"><button id="live" type="button">Live AI trial</button><button id="stop" type="button" disabled>Stop</button></div>
  <div id="err" role="alert"></div>
  <label class="chk"><input type="checkbox" id="voice" checked> Voices</label>
  <label class="chk"><input type="checkbox" id="auto" checked> Auto camera</label>
  <label>Camera (or drag the scene, scroll to zoom)</label>
  <div class="cams" id="cams"></div>
  <p class="small">Educational simulation. Verdicts are AI-generated, not legal advice. The demo uses a scripted fictional case.</p>
</aside>

<aside id="ev" class="glass"><h3>Evidence board</h3><div id="evl"></div></aside>
<div id="sub" class="glass"><div class="who" id="sw"></div><div class="t" id="st"></div></div>
<div id="verdict" class="glass"><h3>The court’s verdict</h3><p id="vt"></p><div id="vr"></div><ul id="vf"></ul><div id="vm" style="font-weight:600"></div><button id="vx" type="button" style="margin-top:12px">Close</button></div>
<button class="recbtn glass" id="rec" type="button">Recording mode</button>

var dr=null;cv.addEventListener("pointerdown",function(e){dr={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",function(e){if(!dr)return;var dx=e.clientX-dr.x,dy=e.clientY-dr.y;dr={x:e.clientX,y:e.clientY};pause=performance.now()+8000;var o=gp.clone().sub(gt),s=new T.Spherical().setFromVector3(o);s.theta-=dx*.006;s.phi=Math.min(1.5,Math.max(.25,s.phi-dy*.005));o.setFromSpherical(s);gp.copy(gt).add(o);if(gp.y<.7)gp.y=.7;});

var cur=null,gT=-1e9,clock=new T.Clock();
function loop(){requestAnimationFrame(loop);var t=clock.getElapsedTime(),now=performance.now();
  ppl.forEach(function(u){var sp_=u.role&&u.role===cur;
    u.hd.rotation.y=sp_?Math.sin(t*.8)*.12:Math.sin(t*.4+u.ph)*(u.seated&&!u.role?.28:.08);

    else if(u.type==="type"){u.arms[0].rotation.x=-1.1+Math.sin(t*17)*.08;u.arms[1].rotation.x=-1.1+Math.sin(t*17+2)*.08;}
    else if(sp_){u.arms[1].rotation.x=-1+Math.sin(t*3)*.2;}

  });
  var k=(now-gT)/450;gp_.rotation.z=k<1?Math.sin(k*Math.PI)*-.9:0;
  var pos=dust.geometry.attributes.position;for(var i=0;i<120;i++){pos.array[i*3+1]+=Math.sin(t+i)*.0015;}pos.needsUpdate=true;
  cam.position.lerp(gp,.04);ct.lerp(gt,.05);cam.lookAt(ct);

  if(tgt){sp.position.set(tgt.x,8,tgt.z+1.6);sp.target.position.set(tgt.x,tgt.y+1.2,tgt.z);}

/* ---- trial logic ---- */
var NAMES={analyzer:"Evidence Analyzer",prosecutor:"Prosecutor",defense:"Defense counsel",judge:"Judge",bailiff:"Bailiff"},COL={analyzer:"#3fb5a4",prosecutor:"#e5625f",defense:"#5a8fe0",judge:"#b392f0",bailiff:"#9fb0c4"};
var sampleFn=null,aborted=false,history=[];
try{if(typeof claude!=="undefined"&&claude&&claude.use){claude.use("sample").then(function(s){sampleFn=s;},function(){});}}catch(e){}
function err(m){var e=$("err");e.textContent=m;e.style.display=m?"block":"none";}
function step(n){document.querySelectorAll(".chip").forEach(function(c){var s=+c.dataset.s;c.classList.toggle("on",s===n);c.classList.toggle("done",s<n);});}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
var voices=[];function lv(){voices=(speechSynthesis.getVoices()||[]).filter(function(v){return /^en/i.test(v.lang);});}
if("speechSynthesis" in window){lv();speechSynthesis.onvoiceschanged=lv;}
var VP={judge:[.65,.9,0],prosecutor:[.95,1,1],defense:[1.2,1,2],analyzer:[1.05,1.02,3],bailiff:[.8,1,4]};
function say(role,text){return new Promise(function(res){
  if(aborted)return res();cur=SH[role]||role==="judge"||spk[role]?role:null;if(role==="bailiff")cur=null;
  var sw=$("sw");$("sub").style.display="block";sw.textContent=NAMES[role];sw.style.color=COL[role];
  var st=$("st"),i=0,dur=Math.max(2200,text.length*48),iv=setInterval(function(){i=Math.min(text.length,i+Math.ceil(text.length/(dur/30)));st.textContent=text.slice(0,i);if(i>=text.length)clearInterval(iv);},30);
  var done=false,fin=function(){if(done)return;done=true;clearInterval(iv);st.textContent=text;setTimeout(res,500);};
  if($("voice").checked&&"speechSynthesis" in window){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text),p=VP[role];u.pitch=p[0];u.rate=p[1];if(voices.length)u.voice=voices[p[2]%voices.length];u.onend=function(){setTimeout(fin,200);};u.onerror=fin;speechSynthesis.speak(u);setTimeout(fin,dur*2.4+3000);}catch(e){setTimeout(fin,dur+800);}}
  else setTimeout(fin,dur+800);
});}
function board(ev){$("ev").style.display="block";var l=$("evl");l.innerHTML="";ev.items.forEach(function(it,i){var d=document.createElement("div");d.className="card";d.style.animationDelay=i*.25+"s";var b=document.createElement("b");b.textContent=it.name;var n=document.createElement("i");n.textContent=it.note;d.appendChild(b);d.appendChild(n);var br=document.createElement("div");
  function tg(x,c){var s=document.createElement("span");s.className="tg";s.textContent=x;s.style.color=c;br.appendChild(s);}
  tg(it.admit?"Admitted":"Excluded",it.admit?"#3fb5a4":"#9fb0c4");tg(it.favors==="prosecution"?"Favors prosecution":it.favors==="defense"?"Favors defense":"Neutral",it.favors==="prosecution"?"#e5625f":it.favors==="defense"?"#5a8fe0":"#9fb0c4");tg(it.strength,"#d9aa4a");
  d.appendChild(br);l.appendChild(d);});}
var DEMO={
 ev:{summary:"Four of five items are admitted. The key-card log is the strongest link to the accused. The coworker’s remark about overtime is excluded as speculative.",items:[
  {name:"CCTV: hooded figure, 2:14 AM",favors:"prosecution",strength:"weak",admit:true,note:"Face not visible. Shows someone was there, not who."},
  {name:"Key-card log, cage opened 1:58 AM",favors:"prosecution",strength:"strong",admit:true,note:"Rhodes’s card was used."},
  {name:"Phone location data",favors:"neutral",strength:"moderate",admit:true,note:"Confirms presence in the building, not conduct."},
  {name:"Pawn receipt, matching serials",favors:"prosecution",strength:"moderate",admit:true,note:"Signed by an unidentified man."},
  {name:"Coworker: overtime complaints",favors:"prosecution",strength:"weak",admit:false,note:"Speculative motive. Prejudicial."}]},
 turns:{
  "prosecutor|Opening statement":"Your Honor, on the night of March third, twelve laptops vanished from a locked cage. The key-card log shows Daniel Rhodes’s own card opened that cage at 1:58 AM. Minutes later, a figure in a company hoodie appears on camera, and the stolen serial numbers surface at a pawn shop. Access, timing, and opportunity all point to one man.",
  "defense|Opening statement":"Your Honor, the prosecution has a card swipe and a blurry hoodie. Mr. Rhodes is a supervisor, and opening that cage is part of his job. His phone proves he never left the building, and the camera never shows his face. The pawn receipt is signed by a stranger. Suspicion is not proof beyond reasonable doubt.",
  "prosecutor|Rebuttal":"The defense calls it routine, yet only a handful of people hold cage access, and only one card opened it at 1:58. Whoever wore that hoodie knew the layout and the schedule. Coincidence cannot explain access, timing, and matching serial numbers all at once.",
  "defense|Rebuttal":"Counsel says only a few hold access, but a card can be shared, cloned, or borrowed. The log records a card, not a person. No witness places Mr. Rhodes with a laptop, and no money trail ties him to the pawn shop. The state has built a story and left out the proof."},
 v:{verdict:"Not guilty",reasoning:"The key-card entry shows access, but access alone is not theft. The camera does not identify the defendant, the pawn receipt names an unknown seller, and the phone data places Mr. Rhodes in the building, as expected on a night shift. Together the evidence raises suspicion without proving guilt beyond a reasonable doubt.",key_factors:["Card log shows access, not theft","No identification on video or receipt","Reasonable doubt remains"],remedy:"None"}};
function cs(){return "CASE: "+$("title").value.trim()+" ("+$("type").value+")\nDETAILS: "+$("details").value.trim()+"\nEVIDENCE: "+($("evid").value.trim()||"(none listed)");}
var BASE="You are an agent in JudicAI, an educational courtroom simulation (fictional, not legal advice). Stay in character, plain prose, no markdown.\n";
function adm(ev){return ev.items.filter(function(i){return i.admit;}).map(function(i){return "- "+i.name+" ["+i.strength+", favors "+i.favors+"]";}).join("\n");}
function tr(){return history.map(function(h){return h.w+": "+h.t;}).join("\n\n")||"(none)";}
var LIVE={
 analyze:function(){return sampleFn.json(BASE+cs()+"\nYou are the Evidence Analyzer. If no evidence is listed, infer 3-5 likely items. Decide which are admitted. JSON only: {\"summary\":\"2 sentences\",\"items\":[{\"name\":\"\",\"favors\":\"prosecution|defense|neutral\",\"strength\":\"strong|moderate|weak\",\"admit\":true,\"note\":\"short reason\"}]}",{cache:false});},
 turn:function(role,lab,ev){var crim=$("type").value==="criminal";var side=role==="prosecutor"?(crim?"the Prosecutor arguing guilt":"plaintiff’s counsel arguing liability"):(crim?"the Defense counsel arguing not guilty":"defendant’s counsel arguing no liability");
  return sampleFn([{role:"user",content:BASE+cs()+"\nADMITTED EVIDENCE:\n"+adm(ev)+"\nTRANSCRIPT:\n"+tr()+"\nYou are "+side+". Give your "+lab.toLowerCase()+" in 60-80 words, first person, citing admitted evidence by name and answering the other side."}],{cache:false}).then(function(r){return r.text.trim();});},
 judge:function(ev){var crim=$("type").value==="criminal";return sampleFn.json(BASE+cs()+"\nADMITTED:\n"+adm(ev)+"\nTRANSCRIPT:\n"+tr()+"\nYou are the Judge. JSON only: {\"verdict\":\""+(crim?"Guilty|Not guilty|Insufficient evidence":"Liable|Not liable|Insufficient evidence")+"\",\"reasoning\":\"80-100 words\",\"key_factors\":[\"3 short\"],\"remedy\":\"sentence or relief, or None\"}",{cache:false});}};
function norm(ev){ev.items=(ev.items||[]).slice(0,7).map(function(i){return{name:String(i.name||"Evidence"),favors:String(i.favors||"neutral"),strength:String(i.strength||"moderate"),admit:i.admit!==false,note:String(i.note||"")};});return ev;}
async function trial(live){
  if(live&&!sampleFn){err("Live AI needs this page opened inside Claude. Use the demo instead.");return;}
  if(live&&(!$("title").value.trim()||!$("details").value.trim())){err("Add a case title and details first.");return;}
  err("");aborted=false;history=[];$("demo").disabled=$("live").disabled=true;$("stop").disabled=false;$("verdict").className="glass";$("ev").style.display="none";
  try{
    step(0);shot("wide");await wait(900);
    await say("bailiff","All rise. The Superior Court is now in session, the Honorable A. Justice presiding.");
    gT=performance.now();if(!aborted){shot("judge");}
    await say("judge","Please be seated. We will begin with the evidence.");
    step(1);shot("analyzer");
    var ev=norm(live?await LIVE.analyze():DEMO.ev);if(aborted)throw 0;
    board(ev);var sm=live?"I reviewed the file. "+ev.items.filter(function(i){return i.admit;}).length+" of "+ev.items.length+" items are admitted.":DEMO.ev.summary;
    if(live&&ev.summary)sm=String(ev.summary);
    history.push({w:"Evidence Analyzer",t:sm});await say("analyzer",sm);
    step(2);var rounds=[["prosecutor","Opening statement"],["defense","Opening statement"],["prosecutor","Rebuttal"],["defense","Rebuttal"]];
    for(var k=0;k<rounds.length;k++){var r=rounds[k];if(aborted)throw 0;shot(r[0]);
      var tx=live?await LIVE.turn(r[0],r[1],ev):DEMO.turns[r[0]+"|"+r[1]];if(aborted)throw 0;
      history.push({w:NAMES[r[0]],t:tx});await say(r[0],tx);}
    step(3);cur="judge";shot("judge");$("sub").style.display="none";await wait(1800);
    var v=live?await LIVE.judge(ev):DEMO.v;if(aborted)throw 0;
    shot("verdict");await say("judge","After careful consideration, this court finds: "+v.verdict+". "+String(v.reasoning||""));
    gT=performance.now();setTimeout(function(){gT=performance.now();},700);
    $("vt").textContent=String(v.verdict);$("vr").textContent=String(v.reasoning||"");var ul=$("vf");ul.innerHTML="";(v.key_factors||[]).slice(0,4).forEach(function(f){var li=document.createElement("li");li.textContent=String(f);ul.appendChild(li);});
    $("vm").textContent=v.remedy&&String(v.remedy)!=="None"?String(v.remedy):"";$("verdict").className="glass show";
  }catch(e){if(e&&e.code==="not_granted")err("Permission for the AI agents was declined.");else if(e&&e.code==="rate_limited")err("Too many requests. Try again in a minute.");else if(e)err((e&&e.message)||"Something went wrong.");}
  finally{cur=null;$("demo").disabled=$("live").disabled=false;$("stop").disabled=true;if("speechSynthesis" in window)speechSynthesis.cancel();setTimeout(function(){if(!$("verdict").classList.contains("show"))$("sub").style.display="none";shot("wide");},600);}
}
$("demo").onclick=function(){$("title").value="State v. Daniel Rhodes";$("type").value="criminal";$("details").value="Daniel Rhodes, a night-shift supervisor at Harbor Logistics, is accused of stealing 12 laptops (about $14,000) from the warehouse on March 3rd. He says he was on break and that several employees have keys to the storage cage.";$("evid").value="CCTV of a hooded person near the cage at 2:14 AM (face not visible)\nKey-card log: Rhodes’s card opened the cage at 1:58 AM\nCoworker statement about unpaid overtime complaints\nPawn shop receipt with matching serial numbers, signed by an unidentified man\nPhone location data placing Rhodes in the building all night";trial(false);};
$("live").onclick=function(){trial(true);};

addEventListener("keydown",function(e){if(e.key==="Escape")document.body.classList.remove("rec");});

})();
